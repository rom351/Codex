# Магазин + Caddy (сам получает и продлевает HTTPS-сертификат для вашего домена).
# Запуск:  docker compose up -d --build
services:
  shop:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
    volumes:
      - shop-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?Укажите DOMAIN в файле .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - shop

volumes:
  shop-data:
  caddy-data:
  caddy-config:
